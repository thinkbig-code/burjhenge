<style>
/* One picture. The scene is the whole page; type sits on the sky, controls sit on the ground. Single deliberate dusk look. */
:root{
  --night:#07080d;
  --sun:#ffb54a;
  --text:#efe7da;
  --mute:#8a86a6;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --inset:clamp(18px,4.5vw,40px);
  --ls:.14em;
  color-scheme:dark;
}
html,body{height:100%;background:var(--night);color:var(--text);overflow:hidden}
body{font-family:var(--mono)}
.scene{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.scene:active{cursor:grabbing}
.scene:focus-visible{outline:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;left:var(--inset);right:var(--inset);top:calc(var(--inset) + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.when{position:relative;display:grid;gap:10px;min-width:0}
.days{display:flex;align-items:center;gap:2px;margin-left:-12px;pointer-events:auto}
.days button{width:40px;height:40px;border:0;background:none;color:var(--text);opacity:.6;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.days button:hover{opacity:1;color:var(--sun)}
.days button:disabled{opacity:.15;cursor:default}
.days svg{width:15px;height:15px}
.rel{font-size:9px;letter-spacing:.2em;color:var(--mute);min-width:76px;text-align:center}
.date{pointer-events:auto;background:none;border:0;padding:0;color:var(--text);cursor:pointer;text-align:left;font-family:var(--display);font-weight:800;font-size:clamp(64px,17vw,150px);line-height:.8;white-space:nowrap;font-variant-numeric:tabular-nums}
.time{pointer-events:auto;display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:4px 0;color:var(--sun);cursor:pointer;text-align:left}
.time b{font-family:var(--display);font-weight:500;font-size:clamp(30px,7vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.time span{font:10px var(--mono);letter-spacing:var(--ls);color:var(--text);opacity:.75;border-bottom:1px solid rgba(239,231,218,.3);padding-bottom:2px}
.time:hover span{opacity:1}
.where{display:grid;justify-items:end;gap:10px;padding-top:58px;text-align:right}
.kmrow{display:flex;align-items:center;gap:8px;pointer-events:auto}
.km{font-size:11px;letter-spacing:var(--ls)}
.km i{display:block;font-style:normal;font-size:9px;color:var(--mute);margin-top:4px}
.acts{display:flex;align-items:center;gap:2px;margin-right:-10px;pointer-events:auto}
.go{display:flex;align-items:center;gap:2px}
#route svg,#altIco svg{width:16px;height:16px}
.alt{width:36px;height:36px;border:1px solid rgba(239,231,218,.2);border-radius:50%;background:none;color:var(--mute);display:grid;place-items:center;cursor:pointer;padding:0}
.alt:hover,.alt:focus-visible{color:var(--sun);border-color:var(--sun)}
.btn{height:40px;min-width:40px;padding:0 10px;border:0;border-radius:20px;background:transparent;color:var(--text);display:flex;align-items:center;gap:7px;font:10px var(--mono);letter-spacing:var(--ls);text-decoration:none;cursor:pointer}
.btn svg{width:14px;height:14px}
.btn:hover{color:var(--sun)}
.btn.q{color:var(--mute)}
.toast{font-size:9px;letter-spacing:var(--ls);color:var(--sun);min-height:11px}
.foot{position:absolute;left:var(--inset);right:var(--inset);bottom:calc(var(--inset) + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
.brandrow{display:flex;align-items:baseline;gap:16px;pointer-events:auto}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.32em}
.ig{font-size:9px;letter-spacing:var(--ls);color:var(--mute);text-decoration:none;padding:8px 0}
.ig:hover,.ig:focus-visible{color:var(--sun)}
.brand b{color:var(--sun);font-weight:800}
.tl{display:flex;align-items:center;gap:12px;pointer-events:auto;width:min(440px,60%)}
.play{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(239,231,218,.28);background:none;color:var(--text);display:grid;place-items:center;cursor:pointer}
.play:hover{border-color:var(--sun);color:var(--sun)}
.play svg{width:12px;height:12px}
.track{position:relative;flex:1;height:38px;cursor:pointer;touch-action:none}
.track:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.ticks{position:absolute;left:0;right:0;top:9px;height:10px;
  background-image:linear-gradient(to right,rgba(239,231,218,.32) 1px,transparent 1px),linear-gradient(to right,rgba(239,231,218,.16) 1px,transparent 1px);
  background-size:calc((100% - 1px)/6) 10px,calc((100% - 1px)/18) 5px;background-position:0 0,0 5px;background-repeat:repeat-x}
.ticks:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:rgba(239,231,218,.16)}
.moment{position:absolute;left:50%;top:5px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--sun);box-shadow:0 0 8px var(--sun)}
.thumb{position:absolute;top:3px;width:2px;height:22px;margin-left:-1px;background:var(--text);border-radius:1px;left:50%}
.tlab{position:absolute;bottom:0;font-size:8px;letter-spacing:.08em;color:var(--mute);font-variant-numeric:tabular-nums}
.tlab.a{left:0}.tlab.b{right:0}
.navx{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:96px;border:0;background:none;color:var(--text);opacity:.35;cursor:pointer;display:grid;place-items:center}
.cal{position:absolute;left:0;top:100%;margin-top:12px;z-index:5;pointer-events:auto;width:266px;padding:12px 12px 10px;background:rgba(7,8,13,.94);border:1px solid rgba(239,231,218,.14);border-radius:10px;font-size:10px}
.cal header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;letter-spacing:var(--ls)}
.cal header button{width:36px;height:36px;border:0;background:none;color:var(--text);opacity:.7;cursor:pointer;border-radius:50%;display:grid;place-items:center}
.cal header button:hover{opacity:1;color:var(--sun)}
.cal header button:disabled{opacity:.15;cursor:default}
.cal header svg{width:13px;height:13px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-variant-numeric:tabular-nums}
.grid .wd{font-size:8px;color:var(--mute);padding:4px 0}
.grid button{height:34px;border:1px solid transparent;border-radius:50%;background:none;color:var(--text);font:10px var(--mono);cursor:pointer}
.grid button:hover{border-color:rgba(239,231,218,.3)}
.grid button:disabled{opacity:.18;cursor:default;border-color:transparent}
.grid button.today{color:var(--sun)}
.grid button.sel{border-color:var(--sun)}
.cfoot{display:flex;justify-content:flex-end;margin-top:6px}
.cfoot button{height:34px;padding:0 12px;border:0;border-radius:17px;background:none;color:var(--sun);font:10px var(--mono);letter-spacing:var(--ls);cursor:pointer}
.cfoot button:hover{background:rgba(255,181,74,.1)}
.minew{position:absolute;right:calc(var(--inset) - 10px);top:calc(var(--inset) + env(safe-area-inset-top,0px) - 4px);z-index:6}
.mp{position:absolute;right:10px;top:100%;margin-top:8px;width:min(292px,calc(100vw - 2 * var(--inset)));padding:14px;background:rgba(7,8,13,.95);border:1px solid rgba(239,231,218,.14);border-radius:10px;display:grid;gap:12px;font-size:10px;letter-spacing:.06em;line-height:1.6}
.pbtn{height:38px;border:1px solid rgba(239,231,218,.25);border-radius:19px;background:none;color:var(--text);font:10px var(--mono);letter-spacing:var(--ls);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px}
.pbtn:hover{border-color:var(--sun);color:var(--sun)}
.pbtn.solid{background:var(--sun);border-color:var(--sun);color:#07080d}
.pbtn svg{width:14px;height:14px}
.mp .or{font-size:8px;letter-spacing:var(--ls);color:var(--mute)}
.mp .row{display:flex;gap:8px;align-items:center}
.mp input{flex:1;min-width:0;height:38px;padding:0 10px;background:rgba(239,231,218,.06);border:1px solid rgba(239,231,218,.18);border-radius:6px;color:var(--text);font:11px var(--mono)}
.mp input:focus{outline:none;border-color:var(--sun)}
.floor{display:flex;align-items:center;gap:6px;letter-spacing:var(--ls)}
.floor span{flex:1;color:var(--mute);font-size:9px}
.floor button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(239,231,218,.2);background:none;color:var(--text);font:14px var(--mono);cursor:pointer}
.floor output{min-width:34px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
.pmsg{color:var(--mute);font-size:9px}
.pmsg b{color:var(--text);font-weight:400}
.note{font-size:9px;letter-spacing:.08em;line-height:1.6;color:var(--text);max-width:280px;min-height:0;opacity:0;transition:opacity .25s;text-shadow:0 0 12px rgba(7,8,13,.8)}
.note.on{opacity:.9}
.note2{display:none;font-size:9px;letter-spacing:.08em;line-height:1.6;color:var(--text)}
.time:disabled{cursor:default}
.time:disabled span{border-bottom-color:transparent}
@media (max-width:520px){
  .note{display:none}
  .where.noting .km{display:none}
  .where.noting .note2{display:block}
  .foot{flex-direction:column;align-items:stretch;gap:12px}
  .tl{order:-1;width:100%}
  .where{position:fixed;left:var(--inset);right:var(--inset);top:auto;bottom:calc(var(--inset) + 82px + env(safe-area-inset-bottom,0px));padding-top:0;display:grid;justify-items:stretch;gap:8px;text-align:left}
  .acts{justify-content:space-between;margin:0 -10px}
  .km i{display:inline;margin:0 0 0 6px}
  .toast{position:absolute;right:0;bottom:-16px}
}
@media (max-width:360px){.km i{display:none}}
button:focus-visible,a:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.linkbox{font:9px var(--mono);width:200px;background:var(--night);color:var(--text);border:1px solid rgba(239,231,218,.2);border-radius:4px;padding:4px 6px;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="scene" id="scene" tabindex="0" role="img" aria-label="Burj Khalifa with the sun on its spire">

        <button class="btn" id="share" aria-label="Share a link to this moment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg><span class="lbl">SHARE</span></button>
      </div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>
  <div class="minew">
    <button class="btn" id="mine" aria-haspopup="dialog" aria-expanded="false" aria-controls="mp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-6-5.4-6-11a6 6 0 1 1 12 0c0 5.6-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span id="mineTxt">MY PLACE</span></button>
    <div class="mp" id="mp" role="dialog" aria-label="When it happens at your place" hidden>
      <button class="pbtn solid" id="geo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>USE MY LOCATION</button>
      <div class="or">OR PASTE A GOOGLE MAPS LINK OR COORDINATES</div>

  <div class="foot">

      <div class="track" id="track" tabindex="0" role="slider" aria-label="Minutes from the moment on the spire" aria-valuemin="-90" aria-valuemax="90" aria-valuenow="0">

</div>

<script>
(()=>{
const R=Math.PI/180, D=180/Math.PI;
const BURJ={lat:25.19719,lon:55.27437,h:828};
const TZ=4*3600e3; // Dubai, no DST
const SANDBOX_SHARE_BASE="https://claude.ai/artifact/UnGfLrrByRuRVm9HGjHZqQ";
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function sunpos(ms,lat,lon){
  const n=ms/86400e3+2440587.5-2451545.0;
  const L=(280.460+0.9856474*n)%360, g=((357.528+0.9856003*n)%360)*R;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*R, eps=(23.439-4e-7*n)*R;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=((18.697374558+24.06570982441908*n)%24+24)%24;
  const H=((gmst*15+lon)%360)*R-ra, la=lat*R;
  let alt=Math.asin(Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H))*D;
  const az=(Math.atan2(-Math.sin(H),Math.tan(dec)*Math.cos(la)-Math.sin(la)*Math.cos(H))*D+360)%360;
  if(alt>-1) alt+=1.02/Math.tan((alt+10.3/(alt+5.11))*R)/60;
  return {az,alt};
}
function bearing(a,b){
  const l1=a.lat*R,l2=b.lat*R,d=(b.lon-a.lon)*R;
  return (Math.atan2(Math.sin(d)*Math.cos(l2),Math.cos(l1)*Math.sin(l2)-Math.sin(l1)*Math.cos(l2)*Math.cos(d))*D+360)%360;
}
function dist(a,b){
  const l1=a.lat*R,l2=b.lat*R,h=Math.sin((l2-l1)/2)**2+Math.cos(l1)*Math.cos(l2)*Math.sin((b.lon-a.lon)*R/2)**2;
  return 2*6371000*Math.asin(Math.sqrt(h));
}
function dest(o,brg,m){
  const d=m/6371000,b=brg*R,l1=o.lat*R,g1=o.lon*R;
  const l2=Math.asin(Math.sin(l1)*Math.cos(d)+Math.cos(l1)*Math.sin(d)*Math.cos(b));
  const g2=g1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(l1),Math.cos(d)-Math.sin(l1)*Math.sin(l2));
  return {lat:l2*D,lon:g2*D};
}
const wrap=x=>((x+540)%360)-180;
function dubaiMidnight(ms){const d=new Date(ms+TZ);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-TZ}
const DAY0=dubaiMidnight(Date.now()), NDAYS=365;
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function skyCols(alt){
  const P=[[-6,[8,9,26],[54,28,64]],[-1,[14,14,42],[122,46,79]],[2,[36,31,79],[255,110,64]],[8,[33,48,98],[255,170,92]],[20,[38,78,140],[236,204,150]]];
  if(alt<=P[0][0]) return [P[0][1],P[0][2]];
  for(let i=1;i<P.length;i++) if(alt<=P[i][0]){const t=(alt-P[i-1][0])/(P[i][0]-P[i-1][0]);return [mix(P[i-1][1],P[i][1],t),mix(P[i-1][2],P[i][2],t)]}
  return [P[4][1],P[4][2]];
}
const PROF=[[0,46],[.12,46],[.12,40],[.27,38],[.27,32],[.42,29],[.42,24],[.55,21],[.55,16],[.66,13],[.66,9.5],[.74,8],[.74,5],[.79,4],[.82,2.6],[.9,1.6],[1,.5]];
function rand(seed){return()=>((seed=(seed*16807)%2147483647)/2147483647)}

function onLand(x,y){
  let bd=1e18,side=1;
  for(const l of GEO.c) for(let i=0;i+3<l.length;i+=2){
    const ax=l[i]*10,ay=l[i+1]*10,bx=l[i+2]*10,by=l[i+3]*10,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy||1;
    const t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L)),qx=ax+t*dx-x,qy=ay+t*dy-y,d=qx*qx+qy*qy;
    if(d<bd){bd=d;side=dx*(y-ay)-dy*(x-ax)}
  }
  return side>0;
}
const LINE_MIN=1500, LINE_MAX=22000, lineCache={};
function spireLines(day){
  if(lineCache[day]) return lineCache[day];
  const mid=DAY0+day*86400e3, aMin=Math.atan(BURJ.h/LINE_MAX)*D, aMax=Math.atan(BURJ.h/LINE_MIN)*D, out=[];
  for(const pm of [false,true]){
    const pts=[];
    for(let t=mid+(pm?12:4)*3600e3;t<=mid+(pm?20:12)*3600e3;t+=60e3){
      const p=sunpos(t,BURJ.lat,BURJ.lon);
      if((p.az>180)!==pm||p.alt<aMin||p.alt>aMax) continue;
      pts.push({t,th:(p.az+180)%360,m:BURJ.h/Math.tan(p.alt*R)});
    }
    if(pts.length>1) out.push({pm,pts});
  }
  return lineCache[day]=out;
}

/* ---------- where to stand ----------
   Each day has a sunset line and a sunrise line of places where the sun sits on the spire.
   Only points on land, 2 to 22 km from the tower, are offered. */
const candCache={};
function candidates(day,pm,sea){
  const k=day+(pm?"p":"a")+(sea?"s":""); if(candCache[k]) return candCache[k];
  const L=spireLines(day).find(l=>l.pm===pm); if(!L) return candCache[k]=[];
  return candCache[k]=L.pts.filter(q=>q.m>=2000&&onLand(q.m*Math.sin(q.th*R),q.m*Math.cos(q.th*R))!==!!sea).sort((a,b)=>a.m-b.m);
}
const st={day:0,pm:true,target:8000,q:null,dt:0,place:null,sea:false}; // dt: minutes away from the moment on the spire

/* ---------- my place ----------
   From a fixed place the sun crosses the bearing to the tower once a day (afternoon if the tower is to the west,
   morning if it is to the east). On the days when the sun's altitude at that crossing equals the angle up to the
   spire, it sits on the spire. Eye height comes from the floor, about 3.2 m a floor. */
function crossAt(P,mid,b,pm){
  const a=mid+(pm?11:3.5)*3600e3, z=mid+(pm?20:12.5)*3600e3, step=4*60e3;
  let pt=a, pv=wrap(sunpos(pt,P.lat,P.lon).az-b);
  for(let t=a+step;t<=z;t+=step){
    const v=wrap(sunpos(t,P.lat,P.lon).az-b);
    if(pv*v<=0&&Math.abs(pv-v)<20){
      let lo=pt,hi=t,vl=pv;
      for(let k=0;k<14;k++){const m=(lo+hi)/2,vm=wrap(sunpos(m,P.lat,P.lon).az-b);if(vl*vm<=0)hi=m;else{lo=m;vl=vm}}
      const tt=(lo+hi)/2,p=sunpos(tt,P.lat,P.lon);return p.alt>-1.2?{t:tt,alt:p.alt}:null;
    }
    pt=t;pv=v;
  }
  return null;
}
function placeEvents(P){
  const d=dist(P,BURJ), b=bearing(P,BURJ), pm=b>180, tip=Math.atan((BURJ.h-P.h)/d)*D;
  const xs=[];for(let i=0;i<NDAYS;i++)xs.push(crossAt(P,DAY0+i*86400e3,b,pm));
  const ev=[];
  for(let i=0;i<NDAYS;i++){const x=xs[i];if(!x)continue;const e=Math.abs(x.alt-tip),ep=xs[i-1]?Math.abs(xs[i-1].alt-tip):99,en=xs[i+1]?Math.abs(xs[i+1].alt-tip):99;
    if(e<0.6&&e<=ep&&e<=en&&x.t>Date.now()-30*60e3)ev.push({i,t:x.t})}
  return {...P,d,b,pm,tip,th:bearing(BURJ,P),events:ev,k:0};
}
function pick(){
  if(st.place){const P=st.place,e=P.events[P.k];st.day=e.i;st.pm=P.pm;st.q={th:P.th,m:P.d,t:e.t,h:P.h,b:P.b,o:P};return}
  let C=candidates(st.day,st.pm,st.sea);
  if(!C.length){const alt=candidates(st.day,st.pm,!st.sea);if(alt.length){st.sea=!st.sea;C=alt}}
  if(!C.length){st.q=null;return}
  let best=C[0];C.forEach(q=>{if(Math.abs(Math.log(q.m/st.target))<Math.abs(Math.log(best.m/st.target)))best=q});

  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));a.download="burjhenge-"+fmtDay(e.i)+".ics";document.body.appendChild(a);a.click();a.remove();
});
document.addEventListener("keydown",e=>{
  if(e.altKey||e.ctrlKey||e.metaKey||(e.target.closest&&e.target.closest("input"))||!$("cal").hidden||!$("mp").hidden)return;
  if(e.key==="ArrowRight")$("next").click();
  else if(e.key==="ArrowLeft")$("prev").click();
  else if(e.key==="ArrowUp"){e.preventDefault();setDt(st.dt+5)}
  else if(e.key==="ArrowDown"){e.preventDefault();setDt(st.dt-5)}
  else if(e.key==="s")$("mode").click();
  else return;
  hideHint();
});
function shareURL(){
  const sandbox=!/^https?:$/.test(location.protocol)||/claude/i.test(location.hostname);
  return (sandbox?SANDBOX_SHARE_BASE:location.origin+location.pathname)+"#"+token();
}
$("share").addEventListener("click",async()=>{
  const url=shareURL(),toast=$("toast"),say=m=>{toast.textContent=m;clearTimeout(say.t);say.t=setTimeout(()=>toast.textContent="",2000)};
  try{if(navigator.share){await navigator.share({title:"Burjhenge",text:`${$("date").textContent} ${$("time").textContent} · the sun sits on the spire of Burj Khalifa #burjhenge. Stand here:`,url});return}}catch(err){if(err&&err.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);say("LINK COPIED");return}catch(err){}
  toast.textContent="";const inp=document.createElement("input");inp.className="linkbox";inp.readOnly=true;inp.value=url;inp.setAttribute("aria-label","Link to this moment");toast.appendChild(inp);inp.focus();inp.select();inp.addEventListener("blur",()=>{toast.textContent=""},{once:true});
});
window.addEventListener("hashchange",()=>{if(location.hash.slice(1)!==lastHash&&readHash())render(true)});
new ResizeObserver(()=>frame()).observe(document.documentElement);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>frame());
render(false);
})();
</script>
